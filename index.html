<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d3b33">
<title>Plan Integral del IMSS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --pino: #0d3b33;
    --pino-2: #14493f;
    --jade: #007166;
    --menta: #6ed8c0;
    --oro: #c9a35b;
    --tinta: #13231f;
    --niebla: #f3f5f4;
    --papel: #ffffff;
    --linea: #dce3e0;
    --pizarra: #52625c;
    --atraso: #b3263e;
    --f-display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
    --f-texto: "Instrument Sans", ui-sans-serif, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    font-family: var(--f-texto);
    color: var(--tinta);
    background:
      radial-gradient(1200px 600px at 50% -10%, var(--pino-2), transparent 60%),
      linear-gradient(160deg, var(--pino) 0%, #0a2f29 100%);
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--papel);
    border: 1px solid var(--linea);
    border-radius: 16px;
    padding: 34px 32px 30px;
    box-shadow: 0 24px 60px rgba(0,0,0,.28);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 22px;
  }
  .brand .mark {
    height: 46px; width: auto; flex: 0 0 auto;
    display: block;
  }
  .brand .mark path { fill: var(--jade); }
  .brand .who { line-height: 1.15; }
  .brand .who b {
    font-family: var(--f-display); font-weight: 700;
    font-size: 15px; letter-spacing: .2px; display: block;
  }
  .brand .who span { font-size: 12px; color: var(--pizarra); }
  h1 {
    font-family: var(--f-display);
    font-weight: 600;
    font-size: 21px;
    margin: 0 0 3px;
    letter-spacing: -.2px;
  }
  .sub { margin: 0 0 22px; font-size: 13px; color: var(--pizarra); }
  form { display: grid; gap: 15px; }
  label { display: grid; gap: 6px; font-size: 12.5px; font-weight: 500; color: var(--pizarra); }
  input {
    font: inherit; color: var(--tinta);
    padding: 11px 13px;
    border-radius: 10px;
    border: 1px solid var(--linea);
    background: var(--niebla);
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  input:focus {
    outline: none;
    background: var(--papel);
    border-color: var(--jade);
    box-shadow: 0 0 0 3px rgba(0,113,102,.15);
  }
  button {
    margin-top: 4px;
    font: inherit; font-weight: 600; font-size: 15px;
    padding: 12px;
    border: 0; border-radius: 10px;
    color: #fff;
    background: linear-gradient(145deg, var(--jade), var(--pino));
    cursor: pointer;
    transition: filter .15s, transform .02s;
  }
  button:hover { filter: brightness(1.07); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .6; cursor: progress; filter: none; }
  .rule { height: 2px; width: 34px; background: var(--oro); border-radius: 2px; margin: 0 0 18px; }
  #msg { font-size: 12.5px; min-height: 16px; color: var(--atraso); }
  .foot { margin-top: 20px; font-size: 11px; color: var(--pizarra); text-align: center; }
</style>
</head>

        <b>Plan Integral</b>
        <span>IMSS · documento protegido</span>
      </div>
    </div>
    <div class="rule"></div>
    <h1>Acceso restringido</h1>
    <p class="sub">Introduce tus credenciales para abrir el documento.</p>

    <label>Usuario
      <input id="user" autocomplete="off" autocapitalize="off" spellcheck="false" required>
    </label>
    <label>Contraseña
      <input id="pass" type="password" required>
    </label>
    <button id="submit" type="submit">Entrar</button>
    <div id="msg" role="status" aria-live="polite"></div>

    <div class="foot">El contenido se descifra en tu navegador.</div>
  </form>

<script>
const MAGIC = "ENC1";        // must match encrypt.py
const SALT_LEN = 16;
const IV_LEN = 12;

const $ = (id) => document.getElementById(id);
const enc = new TextEncoder();

// Parse the packed file: MAGIC(4) | iterations(4, BE) | salt(16) | iv(12) | ciphertext
function parseEnc(buf) {
  const view = new DataView(buf);
  const magic = new TextDecoder().decode(new Uint8Array(buf, 0, 4));
  if (magic !== MAGIC) throw new Error("El archivo secret.enc no tiene el formato esperado.");
  let off = 4;
  const iterations = view.getUint32(off, false); off += 4;
  const salt = new Uint8Array(buf, off, SALT_LEN); off += SALT_LEN;
  const iv = new Uint8Array(buf, off, IV_LEN); off += IV_LEN;
  const ciphertext = new Uint8Array(buf, off);
  return { iterations, salt, iv, ciphertext };
}

// Derive the AES-GCM key from (username + password) via PBKDF2 — mirrors Python.
async function deriveKey(username, password, salt, iterations) {
  const baseKey = await crypto.subtle.importKey(
    "raw", enc.encode(username + password), "PBKDF2", false, ["deriveKey"]
  );
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations, hash: "SHA-256" },
    baseKey,
    { name: "AES-GCM", length: 256 },
    false,
    ["decrypt"]
  );
}

// Swap the login UI for the decrypted document.
function render(html) {
  document.open();
  document.write(html);
  document.close();
}

async function loadEnc() {
  const res = await fetch("secret.enc", { cache: "no-store" });
  if (!res.ok) throw new Error(`No se pudo cargar secret.enc (${res.status}).`);
  return res.arrayBuffer();
}

$("login").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = $("msg");
  const btn = $("submit");
  msg.textContent = "";
  btn.disabled = true;

  try {
    const buf = await loadEnc();
    const { iterations, salt, iv, ciphertext } = parseEnc(buf);
    const key = await deriveKey($("user").value, $("pass").value, salt, iterations);

    let plainBuf;
    try {
      plainBuf = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ciphertext);
    } catch {
      throw new Error("Usuario o contraseña incorrectos.");
    }

    render(new TextDecoder().decode(plainBuf));
  } catch (err) {
    msg.textContent = err.message;
    btn.disabled = false;
    $("pass").value = "";
  }
});
</script>
